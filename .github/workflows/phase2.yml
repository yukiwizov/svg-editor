name: Phase 2 validation
on:
  push:
    branches: [phase2]
  pull_request:
    branches: [phase2]
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run metrics
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-metrics
          path: docs/metrics/phase2.md
          if-no-files-found: error
  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run compile
